# ── Entries ─────────────────────────────────────────────────────────

[[service]]
id = "start"
entry = "service.luau"

[[widget]]
id = "widget"
entry = "widget.luau"

# Dos paneles porque el host es dueño del tamaño y no hay setSize en runtime:
# el widget abre :panel o :float según `panel_mode`.
[[panel]]
id = "panel"
entry = "panel_compact.luau"
width = 880
height = "content"
max_height = 640
placement = "attached"
position = "top_right"
open_near_click = true
dismiss_on_outside_click = true
# Enter queda fuera a propósito: `capture_keys` con Return se come el Enter
# antes de que llegue al buscador.
capture_keys = ["Left", "Right", "g", "Prior", "Next"]

[[panel]]
id = "float"
entry = "float.luau"
width = 1300
height = "content"
max_height = 860
# `attached` (layer-shell) y no `floating`: con `floating` el panel abre
# como toplevel normal y queda DETRÁS de una ventana maximizada. Con
# layer-shell se pinta en la capa superior, siempre arriba.
placement = "attached"
position = "top_right"
capture_keys = ["Left", "Right", "g", "Prior", "Next"]

[[setting]]
key = "layout_mode"
type = "select"
label_key = "settings.layout_mode.label"
description_key = "settings.layout_mode.desc"
default = "auto"
options = [
  { value = "auto", label_key = "settings.layout_mode.auto" },
  { value = "fixed", label_key = "settings.layout_mode.fixed" },
]

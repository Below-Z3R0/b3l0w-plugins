[[setting]]
key = "video_loop"
type = "bool"
label_key = "settings.video_loop.label"
description_key = "settings.video_loop.description"
default = true

[[setting]]
key = "video_mute"
type = "bool"
label_key = "settings.video_mute.label"
description_key = "settings.video_mute.description"
default = true

[[setting]]
key = "video_hwdec"
type = "bool"
label_key = "settings.video_hwdec.label"
description_key = "settings.video_hwdec.description"
default = true

[[setting]]

entry = "panel_e1500.luau"
# Escalón de 1500 px: la entrada histórica y la única VISIBLE en el
# launcher. Las demás (`panel_w<N>`) se ocultan con
# `shell.launcher.panels.ignored` porque son la misma vista con otro ancho.
width = 1500
height = "content"
max_height = 920
placement = "attached"
capture_keys = ["Left", "Right", "Up", "Down", "Prior", "Next", "Home", "End", "Return", "g", "f", "p"]

